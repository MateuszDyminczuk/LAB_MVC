{% extends 'remiza/base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; padding: 30px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; font-family: 'Inter', sans-serif;">
    
    <div style="background: #fee2e2; color: #dc2626; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; font-size: 1.8rem;">
        <i class="fas fa-exclamation-triangle"></i>
    </div>

    <h2 style="font-weight: 700; color: #0f172a; margin-bottom: 10px;">Usuwanie sprzętu</h2>
    <p style="color: #64748b; line-height: 1.5; margin-bottom: 24px;">
        Czy na pewno chcesz usunąć z inwentarza <strong style="color: #0f172a;">{{ sprzet.nazwa }}</strong>?
    </p>

    <form method="post" style="display: flex; gap: 12px; justify-content: center;">
        {% csrf_token %}
        <button type="submit" style="background-color: #dc2626; color: #ffffff; font-weight: 700; padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; flex: 1;">
            Tak, usuń
        </button>
        <a href="{% url 'sprzet_lista' %}" style="background-color: #64748b; color: #ffffff; font-weight: 700; padding: 12px 24px; border-radius: 12px; text-decoration: none; text-align: center; flex: 1;">
            Anuluj
        </a>
    </form>
</div>
{% endblock %}
